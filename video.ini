# RECVX host render quality: original, low, high, ultra
quality = ultra
# Rasterizer: gpu (platform default), opengl, vulkan, d3d12 (Windows) or software
renderer = gpu
# Presentation frame rate (game tick stays 30 Hz): 30, 60, 120 or unlimited
frame_rate = 120
# Presentation upscaler: off, metalfx-spatial, metalfx-temporal (macOS), fsr4 or fsr4-int8 (Windows)
upscaler = metalfx-spatial
# Frame generation (macOS 26 or newer, MetalFX frame interpolation): off or metalfx
frame_generation = metalfx
# Sharpening of the presented image (contrast-adaptive): off, light, medium or strong
sharpness = strong
# CRT post-processing of the presented image: off, crt-light or crt-full
post_process = crt-light
# Widescreen mod (16:9, like the GameCube/PS2 patches; HUD is stretched): off or on
widescreen = on

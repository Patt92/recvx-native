# RECVX Native in the browser (Firefox/Chrome), served on http://localhost:8722 — docs/WEB.md.
# Its own Compose project (recvx-web); the Linux/Windows builder is compose.builder.yaml.
#
#   python3 tools/web_site.py --index-only     # once per data/ change: writes data/web-files.txt
#   docker compose build                       # build the web image
#   docker compose up -d                       # start; docker compose down stops it again
name: recvx-web
services:
  # Game data is mounted read-only, never baked into the image (RECVX_DATA_DIR / RECVX_MODS_DIR override).
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    # Prebuilt image from GitHub Actions instead of a local build: RECVX_WEB_IMAGE (docs/WEB.md).
    image: ${RECVX_WEB_IMAGE:-recvx-web}
    ports:
      - "${RECVX_WEB_PORT:-8722}:8722"
    volumes:
      - type: bind
        source: ${RECVX_DATA_DIR:-./data}
        target: /srv/recvx/data
        read_only: true
      - type: bind
        source: ${RECVX_MODS_DIR:-./mods}
        target: /srv/recvx/mods
        read_only: true
        bind:
          create_host_path: true
    restart: unless-stopped

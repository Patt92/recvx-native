# Builds the native runtimes without game data: no ISO, no data/, no packaging and no tests
# that need disc files. Every job runs the policy check (tools/check_no_original_core.py)
# through the regular build entry point (build.sh / build.ps1 -> tools/build_native.py).
name: Runtimes

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtimes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: windows
            build: build/windows-native
          - arch: arm64
            platform: windows-arm64
            build: build/windows-arm64-native
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # build number = git rev-list --count HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Policy check
        run: python tools/check_no_original_core.py
      - name: Build runtime
        shell: pwsh
        run: ./build.ps1 --platform ${{ matrix.platform }}
      - name: Stage runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem '${{ matrix.build }}' -Recurse -Filter recvx-runtime.exe |
                 Where-Object { $_.FullName -notmatch '[\\/]_deps[\\/]' } | Select-Object -First 1
          if (-not $exe) { throw 'recvx-runtime.exe not found' }
          $out = 'dist/recvx-windows-${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*.exe'), (Join-Path $exe.DirectoryName '*.dll') $out
          $fsr = Join-Path $exe.DirectoryName 'FSR4 INT8'
          if (Test-Path $fsr) { Copy-Item $fsr $out -Recurse }
          Copy-Item README.md, STARTEN.md $out -ErrorAction SilentlyContinue
          # ISO extractor (tools/extract_iso.py): data\ and mods\ go into this folder, the images into iso\.
          New-Item -ItemType Directory -Force "$out/tools", "$out/iso" | Out-Null
          Copy-Item tools/extract_iso.py, tools/prepare_native_data.py, tools/iso9660.py, tools/host_tools.py, tools/cook_movies.py "$out/tools"
          Copy-Item Extract-ISO.cmd $out
          Get-ChildItem $out -Recurse | Select-Object -ExpandProperty FullName
      - uses: actions/upload-artifact@v7
        with:
          name: recvx-windows-${{ matrix.arch }}
          path: dist/recvx-windows-${{ matrix.arch }}
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libgl-dev libegl-dev libgles-dev libvulkan-dev glslc
      - name: Policy check
        run: python3 tools/check_no_original_core.py
      - name: Build runtime
        run: ./build.sh --platform linux
      - name: Stage runtime
        run: |
          out=dist/recvx-linux-x64
          cmake --install build/native --prefix "$out"   # bin/recvx-runtime, RPATH $ORIGIN/../lib
          mkdir -p "$out/lib"
          find build/native/_deps/sdl2-build -maxdepth 1 -name 'libSDL2*.so*' -exec cp -P {} "$out/lib/" \;
          cp README.md STARTEN.md "$out/" 2>/dev/null || true
          # ISO extractor (tools/extract_iso.py): data/ and mods/ go into this folder, the images into iso/.
          mkdir -p "$out/tools" "$out/iso"
          cp tools/extract_iso.py tools/prepare_native_data.py tools/iso9660.py tools/host_tools.py tools/cook_movies.py "$out/tools/"
          cp extract-iso.sh "$out/"
          # Smoke test without a disc: the extractor finds its exporters and asks for an image in iso/.
          if "$out/extract-iso.sh" > extract.log 2>&1; then echo "extractor ran without an image"; exit 1; fi
          grep -q "put your .iso file(s) into" extract.log || { cat extract.log; exit 1; }
          ls -lR "$out"
          tar -C dist -czf dist/recvx-linux-x64.tar.gz recvx-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: recvx-linux-x64
          path: dist/recvx-linux-x64.tar.gz  # tar keeps the executable bit and SDL symlinks
          if-no-files-found: error

  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358  # ANDROID_NDK_MAJOR in tools/build_native.py
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'  # AGP 9 needs JDK 17 or 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslc  # host glslc for the Vulkan SPIR-V
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Policy check
        run: python3 tools/check_no_original_core.py
      - name: Build APK
        run: ./build.sh --platform android
      - uses: actions/upload-artifact@v7
        with:
          name: recvx-android-arm64
          path: build/android-arm64/RECVX-Native.apk
          if-no-files-found: error

  # Publishes the four artifacts once every build job succeeded: a tag v* becomes a regular release,
  # every push to main its own prerelease build-<version> (the version the binaries carry). Nothing
  # is deleted; older builds stay listed.
  web:
    name: Web image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Policy check
        run: python3 tools/check_no_original_core.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Pull requests only build; pushes to main and v* tags publish to the GitHub Container Registry.
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false  # no *.dockerbuild artifact next to the runtime artifacts
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: [windows, linux, android]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # build number = git rev-list --count HEAD, as in tools/build_native.py
      - name: Version
        run: echo "RECVX_VERSION=$(python3 -c 'import sys; sys.path.insert(0, "tools"); import build_native; print(build_native.FULL_VERSION)')" >> "$GITHUB_ENV"
      # Only the runtime artifacts: the web job's build record (*.dockerbuild) is no zip and breaks the download.
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: recvx-*
      - name: Pack assets
        run: |
          mkdir -p assets
          for arch in x64 arm64; do
            (cd artifacts && zip -qr "../assets/recvx-windows-$arch.zip" "recvx-windows-$arch")
          done
          cp artifacts/recvx-linux-x64/recvx-linux-x64.tar.gz assets/
          cp artifacts/recvx-android-arm64/RECVX-Native.apk assets/recvx-android-arm64.apk
          (cd assets && sha256sum * > SHA256SUMS)
          ls -l assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Runtimes only, no game data. Prepare data/ yourself with ./build.sh --iso (see README, section GitHub Actions)."
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            gh release create "${GITHUB_REF_NAME}" assets/* --title "RECVX Native ${GITHUB_REF_NAME}" --notes "$notes" --verify-tag
          else
            tag="build-${RECVX_VERSION}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "release $tag exists already (re-run of the same commit); not replaced"
              exit 0
            fi
            gh release create "$tag" assets/* --prerelease --target "${GITHUB_SHA}" \
              --title "Build ${RECVX_VERSION} (${GITHUB_SHA::7})" --notes "Build of main at ${GITHUB_SHA::7}. $notes"
          fi

name: Native runtime
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/native -DBUILD_TESTING=ON -DRECVX_FETCH_SDL2=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Stage binaries
        run: cmake --install build/native --config Release --prefix build/package
      - uses: actions/upload-artifact@v4
        with:
          name: recvx-native-${{ matrix.os }}
          path: build/package

# RECVX Native — Web-Auslieferung (docker/web.Dockerfile, compose.yaml Dienst "web").
# Pflicht fuer den Browser-Build: Cross-Origin-Isolation (SharedArrayBuffer fuer die Raster-Threads) und
# HTTP-Range-Anfragen (WasmFS-Fetch-Backend laedt Spieldaten in 16-MB-Bloecken bei Bedarf).
server {
    listen 8722;
    listen [::]:8722;
    server_name _;

    root /srv/recvx/site;
    index index.html;

    # Fuer alle Antworten, auch Fehlerseiten und Worker-Skripte (pthreads laden recvx.js als Worker).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        image/png png;
        image/jpeg jpg;
        application/json json;
        text/plain txt;
    }
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    # Programmteile komprimiert ausliefern; Spieldaten nie (Range-Anfragen brauchen unveraenderte Bytes).
    gzip on;
    gzip_types application/javascript application/wasm text/html;
    gzip_min_length 1024;

    location = /index.html { add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin" always; add_header Cross-Origin-Embedder-Policy "require-corp" always; add_header Cross-Origin-Resource-Policy "same-origin" always; }
    location ~ \.(js|wasm)$ { add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin" always; add_header Cross-Origin-Embedder-Policy "require-corp" always; add_header Cross-Origin-Resource-Policy "same-origin" always; }

    # Spieldaten (read-only Volume). Kein Verzeichnislisting; der Index ist web-files.txt.
    location /data/ {
        alias /srv/recvx/data/;
        autoindex off;
        gzip off;
        # Auch auf 206-/HEAD-Antworten mit Range (nginx sendet ihn dort nicht): sonst laedt der Browser-Client
        # die ganze Datei statt Bloecke (native/web_fetch_backend.js).
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # Optionale Mods (read-only Volume); fehlt der Ordner, antwortet nginx 404 und die Runtime startet ohne Mods.
    location /mods/ {
        alias /srv/recvx/mods/;
        autoindex off;
        gzip off;
        # Auch auf 206-/HEAD-Antworten mit Range (nginx sendet ihn dort nicht): sonst laedt der Browser-Client
        # die ganze Datei statt Bloecke (native/web_fetch_backend.js).
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
